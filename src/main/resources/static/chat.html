<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harness Agent 调试控制台</title>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fa;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #app {
            width: 100%;
            max-width: 900px;
            height: 90vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .header {
            padding: 20px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .config-panel {
            display: flex;
            gap: 12px;
            margin-top: 12px;
        }

        .config-panel input {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            background: rgba(255, 255, 255, 0.9);
        }

        .config-panel input::placeholder {
            color: #999;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background: #fafbfc;
        }

        .message {
            margin-bottom: 16px;
            display: flex;
            flex-direction: column;
        }

        .message.user {
            align-items: flex-end;
        }

        .message.assistant {
            align-items: flex-start;
        }

        .message-header {
            font-size: 12px;
            color: #999;
            margin-bottom: 4px;
            padding: 0 4px;
        }

        .message-bubble {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 14px;
            word-wrap: break-word;
        }

        .message.user .message-bubble {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.assistant .message-bubble {
            background: white;
            color: #333;
            border: 1px solid #e1e4e8;
            border-bottom-left-radius: 4px;
        }

        .message.assistant .message-bubble.streaming {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .input-area {
            padding: 20px 24px;
            background: white;
            border-top: 1px solid #e1e4e8;
        }

        .input-wrapper {
            display: flex;
            gap: 12px;
        }

        .input-wrapper textarea {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e1e4e8;
            border-radius: 8px;
            font-size: 14px;
            resize: none;
            font-family: inherit;
            transition: border-color 0.2s;
        }

        .input-wrapper textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .send-btn {
            padding: 12px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
        }

        .send-btn:hover {
            opacity: 0.9;
        }

        .send-btn:active {
            transform: scale(0.98);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .typing-indicator {
            display: inline-flex;
            gap: 4px;
            padding: 4px 0;
        }

        .typing-indicator span {
            width: 6px;
            height: 6px;
            background: #999;
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-indicator span:nth-child(1) { animation-delay: -0.32s; }
        .typing-indicator span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }

        .clear-btn {
            position: absolute;
            top: 20px;
            right: 24px;
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            color: white;
            font-size: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .clear-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .event-tag {
            display: inline-block;
            padding: 2px 6px;
            background: #e8f4fd;
            color: #0366d6;
            border-radius: 4px;
            font-size: 10px;
            margin-left: 8px;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <div id="app">
        <div class="header">
            <h1>🤖 Harness Agent 调试控制台</h1>
            <div class="config-panel">
                <input v-model="userId" placeholder="User ID (可选)" />
                <input v-model="sessionId" placeholder="Session ID (可选，留空自动生成)" />
            </div>
            <button class="clear-btn" @click="clearMessages">清空对话</button>
        </div>

        <div class="chat-container" ref="chatContainer">
            <div v-for="(msg, index) in messages" :key="index" 
                 :class="['message', msg.role]">
                <div class="message-header">
                    <span>{{ msg.role === 'user' ? '👤 用户' : '🤖 Agent' }}</span>
                    <span v-if="msg.eventType" class="event-tag">{{ msg.eventType }}</span>
                    <span v-if="msg.messageId" style="margin-left: 8px; color: #ccc;">#{{ msg.messageId.substring(0, 8) }}</span>
                </div>
                <div :class="['message-bubble', { streaming: msg.streaming }]">
                    {{ msg.content }}
                    <div v-if="msg.streaming" class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
            
            <div v-if="isConnecting" class="message assistant">
                <div class="message-header">🤖 Agent</div>
                <div class="message-bubble">
                    <div class="typing-indicator">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>
                </div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    v-model="inputMessage"
                    @keydown.enter.exact.prevent="sendMessage"
                    placeholder="输入消息... (Enter 发送，Shift+Enter 换行)"
                    rows="2"
                ></textarea>
                <button 
                    class="send-btn" 
                    @click="sendMessage"
                    :disabled="!inputMessage.trim() || isConnecting"
                >
                    发送
                </button>
            </div>
        </div>
    </div>

    <script>
        const { createApp, ref, nextTick, watch } = Vue;

        createApp({
            setup() {
                const userId = ref('user_' + Date.now());
                const sessionId = ref('');
                const inputMessage = ref('');
                const messages = ref([]);
                const isConnecting = ref(false);
                const chatContainer = ref(null);

                // 生成 Session ID
                const generateSessionId = () => {
                    return 'session_' + Date.now() + '_' + Math.random().toString(36).substring(2, 9);
                };

                // 滚动到底部
                const scrollToBottom = async () => {
                    await nextTick();
                    if (chatContainer.value) {
                        chatContainer.value.scrollTop = chatContainer.value.scrollHeight;
                    }
                };

                watch(messages, () => scrollToBottom(), { deep: true });

                // 清空消息
                const clearMessages = () => {
                    messages.value = [];
                    sessionId.value = generateSessionId();
                };

                // 发送消息
                const sendMessage = async () => {
                    const message = inputMessage.value.trim();
                    if (!message || isConnecting.value) return;

                    // 确保有 Session ID
                    if (!sessionId.value) {
                        sessionId.value = generateSessionId();
                    }

                    // 添加用户消息
                    messages.value.push({
                        role: 'user',
                        content: message,
                        timestamp: new Date()
                    });

                    inputMessage.value = '';
                    isConnecting.value = true;

                    // 添加助手消息占位符
                    const assistantMsgIndex = messages.value.length;
                    messages.value.push({
                        role: 'assistant',
                        content: '',
                        streaming: true,
                        eventType: '',
                        messageId: ''
                    });

                    try {
                        const response = await fetch('/api/harness/chat', {
                            method: 'POST',
                            headers: {
                                'Content-Type': 'application/json'
                            },
                            body: JSON.stringify({
                                userId: userId.value,
                                sessionId: sessionId.value,
                                message: message
                            })
                        });

                        if (!response.ok) {
                            throw new Error(`HTTP error! status: ${response.status}`);
                        }

                        const reader = response.body.getReader();
                        const decoder = new TextDecoder();
                        let buffer = '';
                        let hasSeenLastEvent = false;
                        let eventCount = 0;

                        while (true) {
                            const { done, value } = await reader.read();
                            if (done) break;

                            buffer += decoder.decode(value, { stream: true });
                            const lines = buffer.split('\n');
                            buffer = lines.pop() || '';

                            for (const line of lines) {
                                if (!line.trim()) continue;
                                
                                if (line.startsWith('data:')) {
                                    const data = line.slice(5);
                                    if (data === '[DONE]') continue;

                                    try {
                                        const event = JSON.parse(data);
                                        const currentMsg = messages.value[assistantMsgIndex];
                                        eventCount++;
                                        
                                        if (currentMsg) {
                                            // 记录原始事件用于调试
                                            console.log('收到事件 #' + eventCount + ':', event.eventType, 'last:', event.last, 'content length:', (event.content || '').length);
                                            
                                            // 跳过重复的 last:true 事件（REASONING 和 AGENT_RESULT 都可能有 last:true）
                                            if (event.last && hasSeenLastEvent) {
                                                console.log('跳过重复的 last:true 事件 #' + eventCount);
                                                continue;
                                            }
                                            if (event.last) {
                                                hasSeenLastEvent = true;
                                            }
                                            
                                            // 使用响应式方式更新消息
                                            const updatedContent = (currentMsg.content || '') + (event.content || '');
                                            const updatedMsg = {
                                                ...currentMsg,
                                                content: updatedContent,
                                                eventType: event.eventType || currentMsg.eventType,
                                                messageId: event.messageId || currentMsg.messageId,
                                                streaming: !event.last
                                            };
                                            messages.value.splice(assistantMsgIndex, 1, updatedMsg);
                                        }
                                    } catch (e) {
                                        console.error('解析 SSE 数据失败:', e, '原始数据:', data);
                                    }
                                } else {
                                    console.log('跳过非data行:', line.substring(0, 100));
                                }
                            }
                        }
                        console.log('SSE流结束，共处理' + eventCount + '个事件');

                        // 结束流式传输 - 使用splice确保响应式更新
                        const currentMsg = messages.value[assistantMsgIndex];
                        if (currentMsg) {
                            messages.value.splice(assistantMsgIndex, 1, {
                                ...currentMsg,
                                streaming: false
                            });
                        }

                    } catch (error) {
                        console.error('发送消息失败:', error);
                        messages.value[assistantMsgIndex] = {
                            role: 'assistant',
                            content: `❌ 错误：${error.message}`,
                            streaming: false
                        };
                    } finally {
                        isConnecting.value = false;
                    }
                };

                // 初始化 Session ID
                sessionId.value = generateSessionId();

                return {
                    userId,
                    sessionId,
                    inputMessage,
                    messages,
                    isConnecting,
                    chatContainer,
                    clearMessages,
                    sendMessage
                };
            }
        }).mount('#app');
    </script>
</body>
</html>
